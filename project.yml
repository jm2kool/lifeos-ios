name: Matinee
options:
  bundleIdPrefix: com.jm2kool
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Matinee:
    type: application
    platform: iOS
    sources:
      - path: Matinee
      - path: Shared
    dependencies:
      - target: MatineeWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jm2kool.matinee
        PRODUCT_NAME: Matinee
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Matinee
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Config/Matinee.entitlements
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        ENABLE_PREVIEWS: YES
  MatineeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: MatineeWidgets
      - path: Shared
    info:
      path: MatineeWidgets/Info.plist
      properties:
        CFBundleDisplayName: Matinee
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jm2kool.matinee.widgets
        PRODUCT_NAME: MatineeWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Matinee
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Config/MatineeWidgets.entitlements
