name: Probe catalog
on:
  push:
    branches: [main, matinee]
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Call the catalog
        run: |
          mkdir out; cd out
          p() { echo "=== $1" >> probe.txt; curl -sS -m 25 -A "Matinee/1.0" -w "\nHTTP %{http_code}\n" "$1" 2>&1 | head -c 3500 >> probe.txt; echo >> probe.txt; }
          p "https://en.wikipedia.org/w/api.php?action=query&format=json&formatversion=2&generator=search&gsrsearch=dune%20film&gsrlimit=4&prop=pageimages%7Cdescription%7Cpageprops&piprop=thumbnail&pithumbsize=600&ppprop=wikibase_item"
          p "https://en.wikipedia.org/w/api.php?action=query&format=json&formatversion=2&generator=search&gsrsearch=parasite%20hastemplate%3AInfobox_film&gsrlimit=3&prop=pageimages%7Cdescription%7Cpageprops&piprop=thumbnail&pithumbsize=600&ppprop=wikibase_item"
          p "https://en.wikipedia.org/w/api.php?action=query&format=json&formatversion=2&prop=extracts%7Cpageimages%7Cdescription%7Cpageprops&exintro=1&explaintext=1&piprop=thumbnail&pithumbsize=1000&ppprop=wikibase_item&titles=Dune%3A%20Part%20Two"
          echo "=== wikidata" >> probe.txt
          curl -sS -m 25 -A "Matinee/1.0" "https://www.wikidata.org/wiki/Special:EntityData/Q104835752.json" -o wd.json || true
          python3 -c "import json; d=json.load(open('wd.json')); e=list(d['entities'].values())[0]; c=e['claims']; [print(k, [x['mainsnak'].get('datavalue',{}).get('value') for x in c.get(k,[])[:3]]) for k in ['P57','P161','P136','P2047','P577','P345','P495','P4947','P1476']]" >> probe.txt 2>&1 || true
          rm -f wd.json
          p "https://www.wikidata.org/w/api.php?action=wbgetentities&ids=Q1149%7CQ3282637&props=labels&languages=en&format=json"
          ls -l
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete matinee-probe -R $GITHUB_REPOSITORY --yes --cleanup-tag 2>/dev/null || true
          gh release create matinee-probe -R $GITHUB_REPOSITORY out/* --target $GITHUB_SHA --title "probe" --notes "catalog probe" --prerelease
