name: Probe catalog
on:
  push:
    branches: [main, matinee]
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Call the catalog
        run: |
          mkdir out; cd out
          p() { echo "=== $1" >> probe.txt; curl -sS -m 25 -A "Matinee/1.0" -w "\nHTTP %{http_code}\n" "$1" 2>&1 | head -c 3500 >> probe.txt; echo >> probe.txt; }
          p "https://itunes.apple.com/search?term=dune&media=movie&entity=movie&limit=2&country=us"
          p "https://itunes.apple.com/us/rss/topmovies/limit=2/json"
          p "https://itunes.apple.com/us/rss/topmovies/limit=2/genre=4401/json"
          p "https://itunes.apple.com/lookup?id=1720568373&country=us"
          p "https://rss.applemarketingtools.com/api/v2/us/movies/top-movies/2/movies.json"
          p "https://api.imdbapi.dev/titles/tt15239678"
          curl -v -m 20 https://api.imdbapi.dev/titles/tt15239678 > /dev/null 2>> probe.txt || true
          ls -l
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete matinee-probe -R $GITHUB_REPOSITORY --yes --cleanup-tag 2>/dev/null || true
          gh release create matinee-probe -R $GITHUB_REPOSITORY out/* --target $GITHUB_SHA --title "probe" --notes "catalog probe" --prerelease
