name: Probe catalog
on:
  push:
    branches: [main, matinee]
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Call the catalog
        run: |
          mkdir out; cd out
          p() { echo "=== $1" >> probe.txt; curl -sS -m 25 -A "Matinee/1.0" -w "\nHTTP %{http_code}\n" "$1" 2>&1 | head -c 3500 >> probe.txt; echo >> probe.txt; }
          p "https://en.wikipedia.org/w/api.php?action=query&format=json&formatversion=2&generator=search&gsrsearch=dune%20part%20two&gsrlimit=2&prop=pageimages%7Cdescription%7Cpageprops&piprop=thumbnail%7Coriginal&pithumbsize=800&pilicense=any&ppprop=wikibase_item"
          curl -sS -m 25 -A "Matinee/1.0" "https://www.wikidata.org/wiki/Special:EntityData/Q109228991.json" -o wd.json || true
          python3 -c "import json; d=json.load(open('wd.json')); e=list(d['entities'].values())[0]; c=e['claims']; [print(k, [x['mainsnak'].get('datavalue',{}).get('value') for x in c.get(k,[])[:4]]) for k in ['P57','P161','P136','P2047','P577','P345','P4947','P1476']]" >> probe.txt 2>&1 || true
          rm -f wd.json
          for g in 4401 4403 4404 4406 4408 4409 4410 4412 4413 4416 4418 4405 4402 4428; do echo "genre $g: $(curl -sS -m 20 "https://itunes.apple.com/us/rss/topmovies/limit=100/genre=$g/json" | python3 -c "import json,sys; d=json.load(sys.stdin); e=d['feed'].get('entry',[]); e=e if isinstance(e,list) else [e]; print(len(e), e[0]['category']['attributes']['label'] if e else '', '|', e[0]['im:name']['label'] if e else '')" 2>&1)" >> probe.txt; done
          for f in topvideorentals newmovies topmovies; do echo "feed $f: $(curl -sS -m 20 -o /dev/null -w '%{http_code}' "https://itunes.apple.com/us/rss/$f/limit=10/json")" >> probe.txt; done
          ls -l
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete matinee-probe -R $GITHUB_REPOSITORY --yes --cleanup-tag 2>/dev/null || true
          gh release create matinee-probe -R $GITHUB_REPOSITORY out/* --target $GITHUB_SHA --title "probe" --notes "catalog probe" --prerelease
