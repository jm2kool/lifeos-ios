name: Probe catalog
on:
  push:
    branches: [main, matinee]
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Call the catalog
        run: |
          mkdir out; cd out
          p() { echo "=== $1" >> probe.txt; curl -sS -m 25 -A "Matinee/1.0" -w "\nHTTP %{http_code}\n" "$1" 2>&1 | head -c 3500 >> probe.txt; echo >> probe.txt; }
          p "https://itunes.apple.com/search?term=dune&media=movie&limit=2"
          p "https://itunes.apple.com/search?term=inception&media=movie&entity=movie&limit=2&country=us"
          p "https://itunes.apple.com/search?term=past+lives&country=US&media=movie&limit=2"
          p "https://itunes.apple.com/search?term=oppenheimer&entity=movie&limit=2"
          p "https://itunes.apple.com/search?term=parasite&country=in&media=movie&limit=2"
          p "https://itunes.apple.com/lookup?id=6793590242&country=us"
          p "https://itunes.apple.com/us/rss/topmovies/limit=200/json" 
          curl -sS "https://itunes.apple.com/us/rss/topmovies/limit=200/json" | python3 -c "import json,sys;d=json.load(sys.stdin);print('count',len(d['feed']['entry']))" >> probe.txt 2>&1 || true
          ls -l
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete matinee-probe -R $GITHUB_REPOSITORY --yes --cleanup-tag 2>/dev/null || true
          gh release create matinee-probe -R $GITHUB_REPOSITORY out/* --target $GITHUB_SHA --title "probe" --notes "catalog probe" --prerelease
