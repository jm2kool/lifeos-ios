name: Build IPA

on:
  push:
    branches: [main, matinee]
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XC" ] && XC=/Applications/Xcode.app
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      - name: Check the film catalog responds
        continue-on-error: true
        run: |
          curl -sS -m 20 "https://api.imdbapi.dev/search/titles?query=dune&limit=2" | head -c 1500; echo
          curl -sS -m 20 "https://api.imdbapi.dev/titles?types=MOVIE&sortBy=SORT_BY_POPULARITY&sortOrder=ASC&minVoteCount=20000&startYear=2023" | head -c 1200; echo
          curl -sS -m 20 "https://api.imdbapi.dev/titles/tt15239678/credits?pageSize=2" | head -c 1200; echo

      - name: Build (unsigned)
        run: |
          xcodebuild -project Matinee.xcodeproj -target Matinee -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SYMROOT="$PWD/build" build > build.log 2>&1 || {
              grep -E "error:|fatal error" build.log | sort -u | head -60 | while IFS= read -r l; do echo "::error::${l#$PWD/}"; done; exit 1; }
          grep -c "warning:" build.log || true
          test -d build/Release-iphoneos/Matinee.app

      - name: Package .ipa
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Release-iphoneos/Matinee.app Payload/
          zip -qry Matinee.ipa Payload
          ls -lh Matinee.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Matinee-ipa
          path: Matinee.ipa

      - name: Publish the release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          # In its own repo the release is "latest"; on a branch of another repo it gets its own tag.
          OWN_REPO: ${{ github.event.repository.name == 'matinee' }}
        run: |
          if [ "$OWN_REPO" = "true" ]; then TAG=latest; FLAGS="--latest"; else TAG=matinee-latest; FLAGS="--latest=false --target $GITHUB_SHA"; fi
          gh release delete $TAG --yes --cleanup-tag 2>/dev/null || true
          gh release create $TAG Matinee.ipa --title "Matinee (latest build)" $FLAGS \
            --notes "Unsigned build of ${GITHUB_SHA::7}. Install with Sideloadly using your Apple ID."
