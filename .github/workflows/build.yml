name: Build Lumen IPA

on:
  push:
    branches: [lumen]
    paths-ignore: ['**.md', 'docs/**', 'supabase/**', '.github/workflows/server.yml']
  pull_request:
    branches: [lumen]
  workflow_dispatch:
    inputs:
      screenshots:
        description: Also take simulator screenshots
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: lumen-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XC" ] && XC=/Applications/Xcode.app
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      - name: Write Secrets.xcconfig from repository secrets
        env:
          URL_LUMEN: ${{ secrets.LUMEN_SUPABASE_URL }}
          KEY_LUMEN: ${{ secrets.LUMEN_SUPABASE_ANON_KEY }}
          URL_SHARED: ${{ secrets.SUPABASE_URL }}
          KEY_SHARED: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          URL="${URL_LUMEN:-$URL_SHARED}"
          KEY="${KEY_LUMEN:-$KEY_SHARED}"
          # In xcconfig files "//" starts a comment, so the URL is written as https:/$()/host.
          ESCAPED=$(printf '%s' "$URL" | sed 's#//#/$()/#')
          {
            echo "LUMEN_SUPABASE_URL = $ESCAPED"
            echo "LUMEN_SUPABASE_ANON_KEY = $KEY"
          } > Config/Secrets.xcconfig
          [ -n "$URL" ] && echo "Supabase URL: set" || echo "Supabase URL: not set (enter it in the app instead)"
          [ -n "$KEY" ] && echo "Supabase key: set" || echo "Supabase key: not set"

      - name: Build (unsigned)
        run: |
          xcodebuild -project Lumen.xcodeproj -target Lumen -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SYMROOT="$PWD/build" build > build.log 2>&1 || {
              grep -E "error:|fatal error" build.log | sort -u | head -80 | while IFS= read -r l; do echo "::error::${l#$PWD/}"; done; exit 1; }
          grep -c "warning:" build.log || true
          test -d build/Release-iphoneos/Lumen.app
          /usr/libexec/PlistBuddy -c "Print :LumenSupabaseURL" build/Release-iphoneos/Lumen.app/Info.plist | sed 's#//.*#//…#'

      - name: Package the .ipa files
        run: |
          # Two builds of the same app: Lumen.ipa asks for push (needs an Apple ID with push, i.e. a paid developer
          # account); Lumen-no-push.ipa doesn't, for a free Apple ID. Both carry the App Group the widget shares.
          package() {
            rm -rf Payload && mkdir Payload
            cp -R build/Release-iphoneos/Lumen.app Payload/
            if [ -d Payload/Lumen.app/PlugIns/LumenWidgets.appex ]; then
              codesign --force --sign - --entitlements Config/LumenWidgets.entitlements Payload/Lumen.app/PlugIns/LumenWidgets.appex || true
            fi
            codesign --force --sign - --entitlements "$1" Payload/Lumen.app || true
            zip -qry "$2" Payload
            ls -lh "$2"
          }
          package Config/Lumen-push.entitlements Lumen.ipa
          package Config/Lumen.entitlements Lumen-no-push.ipa
          ls Payload/Lumen.app/PlugIns || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-ipa
          path: |
            Lumen.ipa
            Lumen-no-push.ipa

      - name: Publish the release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          OWN_REPO: ${{ github.event.repository.name == 'lumen' }}
          PUBLIC_REPO: ${{ !github.event.repository.private }}
        run: |
          NAME="Lumen (latest build)"
          if [ "$OWN_REPO" = "true" ]; then TAG=latest; else TAG=lumen-latest; fi
          NOTES="Unsigned build of ${GITHUB_SHA::7}. Lumen.ipa has push notifications (needs an Apple ID with push, i.e. a paid developer account); Lumen-no-push.ipa is for a free Apple ID. Install with Sideloadly or AltStore — see README → Install."
          for id in $(gh api repos/$GITHUB_REPOSITORY/releases --jq ".[] | select(.name==\"$NAME\") | .id"); do
            gh api -X DELETE repos/$GITHUB_REPOSITORY/releases/$id >/dev/null || true
          done
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          # The .ipa carries your Supabase address and anon key, so in a public repo it goes into a draft only you can see.
          if [ "$PUBLIC_REPO" = "true" ]; then FLAGS="--draft"; else FLAGS="--latest=false"; fi
          gh release create $TAG Lumen.ipa Lumen-no-push.ipa --title "$NAME" --target $GITHUB_SHA --notes "$NOTES" $FLAGS

      # Simulator screenshots (sample data, no account): only when started by hand with "screenshots" ticked.
      - name: Build for the simulator
        if: ${{ inputs.screenshots }}
        continue-on-error: true
        timeout-minutes: 15
        run: |
          xcodebuild -project Lumen.xcodeproj -target Lumen -configuration Debug -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/simbuild" build > sim.log 2>&1 || { grep -E "error:" sim.log | sort -u | head -60 | while IFS= read -r l; do echo "::error::${l#$PWD/}"; done; exit 1; }
          test -d simbuild/Debug-iphonesimulator/Lumen.app

      - name: Boot an iPhone
        if: ${{ inputs.screenshots }}
        continue-on-error: true
        timeout-minutes: 8
        run: |
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 1[67] Pro \(" | head -1 | grep -oE '[0-9A-F-]{36}')
          [ -z "$UDID" ] && UDID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -oE '[0-9A-F-]{36}')
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark || true
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl install "$UDID" simbuild/Debug-iphonesimulator/Lumen.app

      - name: Screenshots
        if: ${{ inputs.screenshots }}
        continue-on-error: true
        timeout-minutes: 8
        run: |
          APP=com.jm2kool.lumen
          mkdir -p screens
          shot() { sleep "$1"; xcrun simctl io "$UDID" screenshot "screens/$2.png" >/dev/null; }
          run() { name=$1; shift; env "$@" xcrun simctl launch --terminate-running-process "$UDID" $APP >/dev/null; }
          SIMCTL_CHILD_LUMEN_SIGNIN=1 xcrun simctl launch "$UDID" $APP >/dev/null; shot 8 00-sign-in
          run seed SIMCTL_CHILD_LUMEN_DEMO=1; shot 9 01a-first-launch
          run today SIMCTL_CHILD_LUMEN_DEMO=1; shot 6 01-today
          run planner SIMCTL_CHILD_LUMEN_DEMO=1 SIMCTL_CHILD_LUMEN_TAB=planner; shot 6 02-planner
          run plannerA SIMCTL_CHILD_LUMEN_DEMO=1 SIMCTL_CHILD_LUMEN_TAB=planner SIMCTL_CHILD_LUMEN_PLANNER=assignments; shot 6 03-assignments
          run plannerB SIMCTL_CHILD_LUMEN_DEMO=1 SIMCTL_CHILD_LUMEN_TAB=planner SIMCTL_CHILD_LUMEN_PLANNER=activity; shot 6 04-activity
          run focus SIMCTL_CHILD_LUMEN_DEMO=1 SIMCTL_CHILD_LUMEN_TAB=focus SIMCTL_CHILD_LUMEN_FOCUS=1; shot 6 05-focus
          run cards SIMCTL_CHILD_LUMEN_DEMO=1 SIMCTL_CHILD_LUMEN_TAB=cards; shot 6 06-cards
          run syllabus SIMCTL_CHILD_LUMEN_DEMO=1 SIMCTL_CHILD_LUMEN_TAB=syllabus; shot 6 07-syllabus
          run proposal SIMCTL_CHILD_LUMEN_DEMO=1 SIMCTL_CHILD_LUMEN_SHEET=proposal; shot 7 08-proposal
          run review SIMCTL_CHILD_LUMEN_DEMO=1 SIMCTL_CHILD_LUMEN_SHEET=review; shot 7 09-review
          run outcome SIMCTL_CHILD_LUMEN_DEMO=1 SIMCTL_CHILD_LUMEN_TAB=focus SIMCTL_CHILD_LUMEN_SHEET=outcome; shot 7 10-outcome
          run assignment SIMCTL_CHILD_LUMEN_DEMO=1 SIMCTL_CHILD_LUMEN_SHEET=assignment; shot 7 11-assignment
          run settings SIMCTL_CHILD_LUMEN_DEMO=1 SIMCTL_CHILD_LUMEN_SHEET=settings; shot 7 12-settings
          run generate SIMCTL_CHILD_LUMEN_DEMO=1 SIMCTL_CHILD_LUMEN_TAB=cards SIMCTL_CHILD_LUMEN_SHEET=generate; shot 7 13-generate
          run lock SIMCTL_CHILD_LUMEN_DEMO=1 SIMCTL_CHILD_LUMEN_SHEET=lock; shot 7 14-study-lock
          ls -lh screens

      - name: Collect crash reports
        if: ${{ always() && inputs.screenshots }}
        continue-on-error: true
        run: |
          mkdir -p screens/crashes
          find ~/Library/Logs/DiagnosticReports -name 'Lumen*' -newer build.log -exec cp {} screens/crashes/ \; 2>/dev/null || true
          ls screens/crashes

      - name: Upload screenshots
        if: ${{ always() && inputs.screenshots }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lumen-screens
          path: screens
          if-no-files-found: ignore
