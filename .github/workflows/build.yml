name: Build IPA

on:
  push:
    branches: [main, matinee]
    paths-ignore: ['**.md', '.github/workflows/probe.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SIMCTL_CHILD_MATINEE_PREVIEW: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XC" ] && XC=/Applications/Xcode.app
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      - name: Bake in keys from repository secrets
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set_key() { if [ -n "$2" ]; then plutil -replace "$1" -string "$2" Config/Info.plist; echo "$1: set"; else echo "$1: not set"; fi; }
          set_key MatineeTMDBToken "$TMDB_TOKEN"
          set_key MatineeSupabaseURL "$SUPABASE_URL"
          set_key MatineeSupabaseAnonKey "$SUPABASE_ANON_KEY"

      - name: Build (unsigned)
        run: |
          xcodebuild -project Matinee.xcodeproj -target Matinee -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SYMROOT="$PWD/build" build > build.log 2>&1 || {
              grep -E "error:|fatal error" build.log | sort -u | head -60 | while IFS= read -r l; do echo "::error::${l#$PWD/}"; done; exit 1; }
          grep -c "warning:" build.log || true
          test -d build/Release-iphoneos/Matinee.app

      - name: Package .ipa
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Release-iphoneos/Matinee.app Payload/
          # Ad-hoc sign with entitlements so the re-signer sees the app group the widget shares with the app.
          if [ -d Payload/Matinee.app/PlugIns/MatineeWidgets.appex ]; then
            codesign --force --sign - --entitlements Config/MatineeWidgets.entitlements Payload/Matinee.app/PlugIns/MatineeWidgets.appex || true
          fi
          codesign --force --sign - --entitlements Config/Matinee.entitlements Payload/Matinee.app || true
          ls Payload/Matinee.app/PlugIns || true
          zip -qry Matinee.ipa Payload
          ls -lh Matinee.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Matinee-ipa
          path: Matinee.ipa

      - name: Publish the release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          OWN_REPO: ${{ github.event.repository.name == 'matinee' }}
          PUBLIC_REPO: ${{ !github.event.repository.private }}
        run: |
          NOTES="Unsigned build of ${GITHUB_SHA::7}. Install with Sideloadly using your Apple ID."
          if [ "$OWN_REPO" = "true" ]; then TAG=latest; NAME="Matinee (latest build)"; else TAG=matinee-latest; NAME="Matinee (latest build)"; fi
          # The .ipa carries your keys, so in a public repo it goes into a draft release only you can see.
          for id in $(gh api repos/$GITHUB_REPOSITORY/releases --jq ".[] | select(.name==\"$NAME\") | .id"); do
            gh api -X DELETE repos/$GITHUB_REPOSITORY/releases/$id >/dev/null || true
          done
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          if [ "$PUBLIC_REPO" = "true" ]; then FLAGS="--draft"; else FLAGS="--latest"; fi
          gh release create $TAG Matinee.ipa --title "$NAME" --target $GITHUB_SHA --notes "$NOTES" $FLAGS

      # Simulator screenshots on the same Mac, so each push needs only one macOS runner.
      - continue-on-error: true
        name: Build for the simulator
        run: |
          xcodebuild -project Matinee.xcodeproj -target Matinee -configuration Debug -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/simbuild" build > sim.log 2>&1 || { grep -E "error:" sim.log | sort -u | head -60 | while IFS= read -r l; do echo "::error::${l#$PWD/}"; done; exit 1; }
          test -d simbuild/Debug-iphonesimulator/Matinee.app

      - continue-on-error: true
        name: Boot an iPhone
        run: |
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 1[67] Pro \(" | head -1 | grep -oE '[0-9A-F-]{36}')
          [ -z "$UDID" ] && UDID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -oE '[0-9A-F-]{36}')
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark || true
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl install "$UDID" simbuild/Debug-iphonesimulator/Matinee.app

      - continue-on-error: true
        name: Screenshots and a short tour
        run: |
          APP=com.jm2kool.matinee
          mkdir -p out
          shot() { sleep "$1"; xcrun simctl io "$UDID" screenshot "out/$2.png"; }
          SIMCTL_CHILD_MATINEE_SIGNIN=1 xcrun simctl launch "$UDID" $APP; shot 9 1-sign-in
          xcrun simctl terminate "$UDID" $APP || true
          xcrun simctl io "$UDID" recordVideo --codec h264 --force out/splash.mp4 & SREC=$!
          sleep 1.5
          SIMCTL_CHILD_MATINEE_SPLASH=1 xcrun simctl launch "$UDID" $APP
          sleep 5
          kill -INT $SREC; wait $SREC || true
          xcrun simctl io "$UDID" recordVideo --codec h264 --force out/tour.mp4 & REC=$!
          sleep 1
          SIMCTL_CHILD_MATINEE_TOUR=1 xcrun simctl launch --terminate-running-process "$UDID" $APP
          shot 7 2-home
          shot 3.5 3-diary
          shot 3.5 4-library
          shot 3.5 5-profile
          sleep 4
          SIMCTL_CHILD_MATINEE_TAB=profile xcrun simctl launch --terminate-running-process "$UDID" $APP; shot 9 5b-profile-mesh
          kill -INT $REC; wait $REC || true
          SIMCTL_CHILD_MATINEE_FILM=tmdb-693134 xcrun simctl launch --terminate-running-process "$UDID" $APP; shot 9 6-film
          SIMCTL_CHILD_MATINEE_FILM=tmdb-496243 SIMCTL_CHILD_MATINEE_SCROLL=1 xcrun simctl launch --terminate-running-process "$UDID" $APP; shot 10 6b-film-scrolled
          SIMCTL_CHILD_MATINEE_TAB=diary SIMCTL_CHILD_MATINEE_LOG=1 xcrun simctl launch --terminate-running-process "$UDID" $APP; shot 7 7-log
          SIMCTL_CHILD_MATINEE_TAB=search xcrun simctl launch --terminate-running-process "$UDID" $APP; shot 5 8-search
          SIMCTL_CHILD_MATINEE_TASTE=1 xcrun simctl launch --terminate-running-process "$UDID" $APP; shot 10 9-taste-quiz
          SIMCTL_CHILD_MATINEE_LIST=1 xcrun simctl launch --terminate-running-process "$UDID" $APP; shot 9 10-list-deck
          SIMCTL_CHILD_MATINEE_SHAKE=1 xcrun simctl launch --terminate-running-process "$UDID" $APP; shot 8 11-shake-pick
          ls -lh out

      - continue-on-error: true
        name: Publish the preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event.repository.name }}" = "matinee" ]; then TAG=preview; else TAG=matinee-preview; fi
          gh release delete $TAG --yes --cleanup-tag 2>/dev/null || true
          gh release create $TAG out/* --target $GITHUB_SHA --title "Matinee preview (simulator)" --notes "Screenshots and a screen recording from an iPhone simulator, using sample data." --prerelease
