name: Build Lumen IPA

on:
  push:
    branches: [lumen]
    paths-ignore: ['**.md', 'docs/**', 'supabase/**', '.github/workflows/server.yml']
  pull_request:
    branches: [lumen]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lumen-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XC" ] && XC=/Applications/Xcode.app
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      - name: Write Secrets.xcconfig from repository secrets
        env:
          URL_LUMEN: ${{ secrets.LUMEN_SUPABASE_URL }}
          KEY_LUMEN: ${{ secrets.LUMEN_SUPABASE_ANON_KEY }}
          URL_SHARED: ${{ secrets.SUPABASE_URL }}
          KEY_SHARED: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          URL="${URL_LUMEN:-$URL_SHARED}"
          KEY="${KEY_LUMEN:-$KEY_SHARED}"
          # In xcconfig files "//" starts a comment, so the URL is written as https:/$()/host.
          ESCAPED=$(printf '%s' "$URL" | sed 's#//#/$()/#')
          {
            echo "LUMEN_SUPABASE_URL = $ESCAPED"
            echo "LUMEN_SUPABASE_ANON_KEY = $KEY"
          } > Config/Secrets.xcconfig
          [ -n "$URL" ] && echo "Supabase URL: set" || echo "Supabase URL: not set (enter it in the app instead)"
          [ -n "$KEY" ] && echo "Supabase key: set" || echo "Supabase key: not set"

      - name: Build (unsigned)
        run: |
          xcodebuild -project Lumen.xcodeproj -target Lumen -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SYMROOT="$PWD/build" build > build.log 2>&1 || {
              grep -E "error:|fatal error" build.log | sort -u | head -80 | while IFS= read -r l; do echo "::error::${l#$PWD/}"; done; exit 1; }
          grep -c "warning:" build.log || true
          test -d build/Release-iphoneos/Lumen.app
          /usr/libexec/PlistBuddy -c "Print :LumenSupabaseURL" build/Release-iphoneos/Lumen.app/Info.plist | sed 's#//.*#//…#'

      - name: Package .ipa
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Release-iphoneos/Lumen.app Payload/
          # Ad-hoc sign with entitlements so the re-signing tool sees the App Group the widget shares with the app.
          if [ -d Payload/Lumen.app/PlugIns/LumenWidgets.appex ]; then
            codesign --force --sign - --entitlements Config/LumenWidgets.entitlements Payload/Lumen.app/PlugIns/LumenWidgets.appex || true
          fi
          codesign --force --sign - --entitlements Config/Lumen.entitlements Payload/Lumen.app || true
          ls Payload/Lumen.app/PlugIns || true
          zip -qry Lumen.ipa Payload
          ls -lh Lumen.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-ipa
          path: Lumen.ipa

      - name: Publish the release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          OWN_REPO: ${{ github.event.repository.name == 'lumen' }}
          PUBLIC_REPO: ${{ !github.event.repository.private }}
        run: |
          NAME="Lumen (latest build)"
          if [ "$OWN_REPO" = "true" ]; then TAG=latest; else TAG=lumen-latest; fi
          NOTES="Unsigned build of ${GITHUB_SHA::7}. Install with Sideloadly or AltStore using your Apple ID — see README → Install."
          for id in $(gh api repos/$GITHUB_REPOSITORY/releases --jq ".[] | select(.name==\"$NAME\") | .id"); do
            gh api -X DELETE repos/$GITHUB_REPOSITORY/releases/$id >/dev/null || true
          done
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          # The .ipa carries your Supabase address and anon key, so in a public repo it goes into a draft only you can see.
          if [ "$PUBLIC_REPO" = "true" ]; then FLAGS="--draft"; else FLAGS="--latest=false"; fi
          gh release create $TAG Lumen.ipa --title "$NAME" --target $GITHUB_SHA --notes "$NOTES" $FLAGS
